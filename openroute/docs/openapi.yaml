    post:
      tags: [migration]
      summary: 执行迁移
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationInput'
      responses:
        '200':
          description: 迁移批次
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MigrateBatch'

  /api/v1/migrations:
    get:
      tags: [migration]
      summary: 迁移批次列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 批次列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/MigrateBatch'
                          pagination:
                            $ref: '#/components/schemas/Pagination'

  /api/v1/migrations/{id}:
    get:
      tags: [migration]
      summary: 批次详情与报告
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: 批次
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MigrateBatch'

  /api/v1/migrations/{id}/progress:
    get:
      tags: [migration]
      summary: 实时进度
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: 进度
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          batch_id: { type: integer, format: int64 }
                          stage: { type: integer }
                          stage_name: { type: string }
                          total_rows: { type: integer, format: int64 }
                          migrated_rows: { type: integer, format: int64 }
                          percent: { type: number, format: float }
                          message: { type: string }

  /api/v1/migrations/{id}/rollback:
    post:
      tags: [migration]
      summary: 回滚该批次
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: 回滚结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
