      description: |
        同时支持旧版文本格式与新版 JSON 格式。

        文本格式：`规则名#监听端口#目标地址#目标端口`，
        双井号表示随机端口，端口可用 `8443-8450` 表示端口段。

        先以 `?preview=true` 调用获得预览，确认后再以 `preview=false` 落库。
      parameters:
        - name: preview
          in: query
          schema: { type: boolean, default: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: 预览结果或导入结果
