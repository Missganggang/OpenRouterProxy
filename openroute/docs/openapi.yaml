openapi: 3.1.0
info:
  title: OpenRoute 面板 API
  version: 1.0.0
  description: |
    OpenRoute 是一个自研、可私有化的 TCP/UDP 转发管理面板。

    ## 认证
    支持四种方式：Session Cookie、JWT Bearer、API Token（`X-API-Key`）、
    节点 Token（`X-Node-Token`）。详见 `docs/API.md`。

    ## 统一响应体
    所有接口返回同一个外层结构，`code` 为 0 表示成功，
    非 0 时 `message` 为中文错误信息，`details` 携带字段级定位信息。

    ## 版本化
    管理接口全部位于 `/api/v1/`；节点通信接口位于 `/api/node/`（不带版本号）。
  license:
    name: 个人自用项目
servers:
  - url: http://127.0.0.1:18888
    description: 默认监听地址（可在 config.yml 中修改）

tags:
  - name: auth
    description: 认证与令牌
  - name: node
    description: 节点管理与监控
  - name: node-group
    description: 节点分组
  - name: device-group
    description: 设备组（入口组 / 出口组）
  - name: rule
    description: 转发规则
  - name: rule-group
    description: 规则分组
  - name: user
    description: 用户与用户分组
  - name: traffic
    description: 流量统计
  - name: probe
    description: 探针与监控
  - name: system
    description: 系统、设置、审计、任务
  - name: alert
    description: 告警
  - name: snapshot
    description: 配置快照
  - name: migration
    description: 迁移与备份
  - name: node-agent
    description: 节点通信（不带 /v1）

security:
  - bearerAuth: []
  - apiKeyAuth: []
  - cookieAuth: []

paths:
  # ───────────────────────── 认证 ─────────────────────────
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      description: |
        校验用户名密码并签发访问令牌与刷新令牌。
        连续失败 3 次后要求图形验证码；10 次失败锁定 15 分钟。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                captcha:
                  type: string
                  description: 图形验证码（连续失败 3 次后必填）
                captcha_id:
                  type: string
                  description: 验证码标识，取自 /auth/captcha
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出
      responses:
        '200':
          $ref: '#/components/responses/OK'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新访问令牌
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前登录用户信息与权限
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: 修改自己的密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/captcha:
    get:
      tags: [auth]
      summary: 获取图形验证码
      description: 返回验证码标识与可直接内联到 img/div 的 SVG 数据。
      security: []
      responses:
        '200':
          description: 验证码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          captcha_id:
                            type: string
                          svg:
                            type: string

  # ───────────────────────── 节点 ─────────────────────────
  /api/v1/nodes:
    get:
      tags: [node]
      summary: 节点列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: group_id
          in: query
          schema: { type: integer, format: int64 }
        - name: online
          in: query
          schema: { type: boolean }
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 节点列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Node'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
    post:
      tags: [node]
      summary: 创建节点
      description: 返回一次性 token 与可直接执行的安装命令（一键对接）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreateInput'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeCreateResult'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [node]
      summary: 节点详情
      responses:
        '200':
          description: 节点
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [node]
      summary: 更新节点
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdateInput'
      responses:
        '200':
          description: 更新后的节点
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Node'
    delete:
      tags: [node]
      summary: 删除节点
      description: 删除后该节点上的规则会被标记为「节点已删除」并进入待处理清单。
      responses:
        '200':
          $ref: '#/components/responses/OK'

  /api/v1/nodes/{id}/install-command:
    post:
      tags: [node]
      summary: 生成安装命令
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: 安装命令与 token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          install_command: { type: string }

  /api/v1/nodes/{id}/upgrade:
    post:
      tags: [node]
      summary: 升级节点客户端
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '502':
          $ref: '#/components/responses/NodeError'

  /api/v1/nodes/{id}/restart:
    post:
      tags: [node]
      summary: 重启节点服务
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '502':
          $ref: '#/components/responses/NodeError'

  /api/v1/nodes/{id}/exec:
    post:
      tags: [node]
      summary: 在节点执行命令
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string }
      responses:
        '200':
          description: 任务已下发
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task_id: { type: integer, format: int64 }
        '403':
          description: 节点设置了 DISABLE_EXECUTE=1，拒绝执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBody'

  /api/v1/nodes/{id}/reset-token:
    post:
      tags: [node]
      summary: 重置节点密钥
      description: 重置后节点需要重新安装才能重新上线。
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: 新 token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }

  /api/v1/nodes/{id}/metrics:
    get:
      tags: [node]
      summary: 节点探针数据
      parameters:
        - $ref: '#/components/parameters/ResourceID'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: interval
          in: query
          description: 聚合粒度；留空则按时间范围自动降采样
          schema:
            type: string
            enum: [1h, 1d, 7d]
      responses:
        '200':
          description: 指标序列
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProbeMetric'

  /api/v1/nodes/{id}/metrics/realtime:
    get:
      tags: [node]
      summary: 节点实时指标
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: 最近一次采样
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProbeMetric'

  /api/v1/nodes/{id}/rules:
    get:
      tags: [node]
      summary: 该节点上运行的规则
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: 规则列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ForwardRule'

  /api/v1/nodes/{id}/logs:
    get:
      tags: [node]
      summary: 节点日志
      parameters:
        - $ref: '#/components/parameters/ResourceID'
        - name: lines
          in: query
          schema: { type: integer, default: 200, maximum: 2000 }
      responses:
        '200':
          description: 日志行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          lines:
                            type: array
                            items: { type: string }

  /api/v1/nodes/{id}/drift:
    get:
      tags: [node]
      summary: 配置漂移详情
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: 漂移详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          drifted: { type: boolean }
                          details: {}

  /api/v1/nodes/{id}/drift/fix:
    post:
      tags: [node]
      summary: 一键纠正配置漂移
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          $ref: '#/components/responses/OK'

  /api/v1/nodes/batch/upgrade:
    post:
      tags: [node]
      summary: 批量升级节点
      requestBody:
        $ref: '#/components/requestBodies/BatchIDs'
      responses:
        '200':
          $ref: '#/components/responses/BatchResult'

  /api/v1/nodes/batch/exec:
    post:
      tags: [node]
      summary: 批量在节点执行命令
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, command]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                command: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/BatchResult'

  /api/v1/nodes/batch/group:
    post:
      tags: [node]
      summary: 批量改分组
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, group_ids]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                group_ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        '200':
          $ref: '#/components/responses/BatchResult'

  /api/v1/nodes/batch/weight:
    post:
      tags: [node]
      summary: 批量改权重
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, weight]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                weight:
                  type: integer
                  minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/BatchResult'

  # ───────────────────────── 节点分组 ─────────────────────────
  /api/v1/node-groups:
    get:
      tags: [node-group]
      summary: 节点分组列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200':
          description: 分组列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/NodeGroup'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
    post:
      tags: [node-group]
      summary: 创建节点分组
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeGroupInput'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeGroup'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/node-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [node-group]
      summary: 节点分组详情
      responses:
        '200':
          description: 分组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeGroup'
    put:
      tags: [node-group]
      summary: 更新节点分组
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeGroupInput'
      responses:
        '200':
          description: 更新后的分组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeGroup'
    delete:
      tags: [node-group]
      summary: 删除节点分组
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/node-groups/{id}/nodes:
    get:
      tags: [node-group]
      summary: 分组内的节点
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: 节点列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Node'

  /api/v1/node-groups/{id}/export:
    get:
      tags: [node-group]
      summary: 导出分组内节点为 CSV
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: CSV 文件
          content:
            text/csv:
              schema:
                type: string

  # ───────────────────────── 设备组 ─────────────────────────
  /api/v1/device-groups:
    get:
      tags: [device-group]
      summary: 设备组列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200':
          description: 设备组列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/DeviceGroup'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
    post:
      tags: [device-group]
      summary: 创建设备组
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceGroupInput'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceGroup'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/device-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      tags: [device-group]
      summary: 设备组详情（含解析后的 Config）
      responses:
        '200':
          description: 设备组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceGroup'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [device-group]
      summary: 更新设备组
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceGroupInput'
      responses:
        '200':
          description: 更新后的设备组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceGroup'
    delete:
      tags: [device-group]
      summary: 删除设备组
      description: 被规则引用时返回 40903。
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 该设备组正在被规则引用，无法删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBody'

  /api/v1/device-groups/{id}/schema:
    get:
      tags: [device-group]
      summary: 该类型组的配置字段 schema
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: schema
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceGroupSchema'

  /api/v1/device-groups-schema:
    get:
      tags: [device-group]
      summary: 按类型取配置字段 schema
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [inbound, outbound]
      responses:
        '200':
          description: schema
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceGroupSchema'

  /api/v1/device-groups/{id}/validate:
    post:
      tags: [device-group]
      summary: 校验配置合法性（含故障转移组兼容性）
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
