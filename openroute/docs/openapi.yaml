        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, scale]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                scale:
                  type: number
                  format: float
                  description: 缩放比例，如 1.5 表示全部 ×1.5
                  example: 1.5
      responses:
        '200':
          description: 更新条数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
