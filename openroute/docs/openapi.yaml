      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationInput'
      responses:
        '200':
          description: 预检报告
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PrecheckReport'
        '400':
          description: 源库无法连接或版本不被支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBody'

