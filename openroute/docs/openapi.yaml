                public_ipv6: { type: string }
                private_ip: { type: string }
                os: { type: string }
                arch: { type: string }
                kernel_ver: { type: string }
                cpu_model: { type: string }
                cpu_cores: { type: integer }
                mem_total: { type: integer, format: int64 }
                disk_total: { type: integer, format: int64 }
                boot_time: { type: string, format: date-time }
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          node_id: { type: integer, format: int64 }
                          config: {}

  /api/node/heartbeat:
    post:
      tags: [node-agent]
      summary: 节点心跳上报
      security:
        - nodeTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: 心跳响应（含是否需要拉取新配置）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          need_config: { type: boolean }
                          config_version: { type: integer, format: int64 }
                          heartbeat_interval: { type: integer }

  /api/node/config:
    get:
      tags: [node-agent]
      summary: 拉取配置
      security:
        - nodeTokenAuth: []
      parameters:
        - name: version
          in: query
          description: 节点当前生效的配置版本；服务端据此决定是否返回增量
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeConfigPayload'

  /api/node/report:
    post:
      tags: [node-agent]
      summary: 上报同步结果与流量
      security:
        - nodeTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rule_results:
                  type: array
                  items:
                    type: object
                    properties:
                      rule_id: { type: integer, format: int64 }
                      ok: { type: boolean }
                      error: { type: string }
                traffic:
                  type: array
                  items:
                    type: object
                    properties:
                      rule_id: { type: integer, format: int64 }
                      user_id: { type: integer, format: int64 }
                      direction:
                        type: string
                        enum: [in, out]
                      raw_bytes: { type: integer, format: int64 }
      responses:
        '200':
          $ref: '#/components/responses/OK'

  /api/node/tasks:
    get:
      tags: [node-agent]
      summary: 拉取待执行任务
      security:
        - nodeTokenAuth: []
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiBody'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            type:
                              type: string
                              enum: [upgrade, restart, exec]
                            payload: {}

  /api/node/task-result:
    post:
      tags: [node-agent]
      summary: 上报任务执行结果
      security:
        - nodeTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, ok]
              properties:
                task_id: { type: integer, format: int64 }
                ok: { type: boolean }
                result: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/OK'

  /install.sh:
    get:
      tags: [node-agent]
      summary: 节点一键安装脚本
      security: []
      parameters:
        - name: t
          in: query
          description: 节点 token
          schema: { type: string }
        - name: u
          in: query
          description: 面板地址
          schema: { type: string }
      responses:
        '200':
          description: bash 脚本
          content:
            text/x-shellscript:
              schema:
                type: string

  /uninstall.sh:
    get:
      tags: [node-agent]
      summary: 节点卸载脚本
      security: []
      responses:
        '200':
          description: bash 脚本
          content:
            text/x-shellscript:
              schema:
                type: string

  /api/node/binary/{arch}:
    get:
      tags: [node-agent]
      summary: 节点二进制下载
      security: []
      parameters:
        - name: arch
          in: path
          required: true
          schema:
            type: string
            enum: [amd64, amd64v3, arm64]
      responses:
        '200':
          description: 二进制
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 访问令牌，由 /auth/login 或 /auth/refresh 获取
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Token，创建时返回一次明文
    cookieAuth:
      type: apiKey
      in: cookie
      name: or_session
      description: WebUI 会话 Cookie（HttpOnly、SameSite=Lax）
    nodeTokenAuth:
      type: apiKey
      in: header
      name: X-Node-Token
      description: 节点密钥，由面板在创建节点时下发

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Sort:
      name: sort
      in: query
      description: 排序字段（只接受白名单内的字段名）
      schema: { type: string }
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    Keyword:
      name: keyword
      in: query
      schema: { type: string }
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 幂等键；相同 key 的重复请求不会重复创建资源
      schema: { type: string }

  requestBodies:
    BatchIDs:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids:
                type: array
                items: { type: integer, format: int64 }

  responses:
    OK:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBody'
    Unauthorized:
      description: 未登录或令牌无效（40101 / 40102 / 40103 / 40104）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBody'
    NotFound:
      description: 资源不存在（40401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBody'
    Conflict:
      description: 资源冲突（40901 名称重复 / 40902 端口占用 / 40903 被引用）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBody'
    ValidationFailed:
      description: 业务校验失败（42201-42210）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBody'
    RateLimited:
      description: 触发限流（42901）
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBody'
    NodeError:
      description: 节点通信错误（60001 离线 / 60002 应用失败 / 60003 超时）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiBody'
    BatchResult:
      description: 批量操作结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiBody'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      succeeded:
                        type: array
                        items: { type: integer, format: int64 }
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            reason: { type: string }

  schemas:
    ApiBody:
      type: object
      properties:
        code:
          type: integer
          description: 0 表示成功，非 0 见错误码字典
        message:
          type: string
        data: {}
        details:
          $ref: '#/components/schemas/ErrorDetails'
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time

    ErrorDetails:
      type: object
      properties:
        field: { type: string }
        value: {}
        hint: { type: string }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }
        total_pages: { type: integer }

    LoginResult:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: 访问令牌有效期（秒） }
        user:
          $ref: '#/components/schemas/User'
        captcha_required: { type: boolean }

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        role:
          type: string
          enum: [admin, user]
        status:
          type: integer
          description: 1 启用 0 禁用
        group_id: { type: integer, format: int64 }
        token: { type: string, description: 用户级订阅 Token }
        traffic_used: { type: integer, format: int64, description: 已用流量（字节，按倍率折算后） }
        traffic_limit: { type: integer, format: int64, description: 0 表示不限 }
        speed_limit: { type: integer, format: int64, description: byte/s，0 表示不限 }
        ip_limit: { type: integer }
        device_limit: { type: integer }
        conn_limit: { type: integer }
        password_reset_required: { type: boolean }
        pending_reinstall: { type: boolean }
        expire_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        last_login_ip: { type: string }
        remark: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserInput:
      type: object
      required: [username]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, format: password, minLength: 6 }
        nickname: { type: string, maxLength: 64 }
        role:
          type: string
          enum: [admin, user]
          default: user
        group_id: { type: integer, format: int64 }
        traffic_limit: { type: integer, format: int64 }
        speed_limit: { type: integer, format: int64 }
        ip_limit: { type: integer }
        device_limit: { type: integer }
        conn_limit: { type: integer }
        expire_at: { type: string, format: date-time, nullable: true }
        remark: { type: string }

    UserGroup:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        traffic_limit: { type: integer, format: int64 }
        speed_limit: { type: integer, format: int64 }
        ip_limit: { type: integer }
        conn_limit: { type: integer }
        rule_group_ids:
          type: array
          description: 可访问的规则分组白名单，空数组表示全部可访问
          items: { type: integer, format: int64 }
        remark: { type: string }

    UserGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        traffic_limit: { type: integer, format: int64 }
        speed_limit: { type: integer, format: int64 }
        ip_limit: { type: integer }
        conn_limit: { type: integer }
        rule_group_ids:
          type: array
          items: { type: integer, format: int64 }
        remark: { type: string }

    Node:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        token: { type: string }
        role:
          type: string
          enum: [inbound, outbound, both]
        public_ipv4: { type: string }
        public_ipv6: { type: string }
        private_ip: { type: string }
        connect_host: { type: string, description: 静态连接地址（出口用） }
        is_static: { type: boolean }
        direct_port: { type: integer }
        ws_port: { type: integer }
        tls_port: { type: integer }
        udp_port: { type: integer }
        rev_port: { type: integer, description: 反向隧道端口 }
        group_ids:
          type: array
          items: { type: integer, format: int64 }
        online: { type: boolean }
        last_seen: { type: string, format: date-time, nullable: true }
        weight: { type: integer, description: 负载均衡权重 }
        max_conn: { type: integer, description: 0 表示不限 }
        os: { type: string }
        arch: { type: string }
        kernel_ver: { type: string }
        client_ver: { type: string }
        cpu_model: { type: string }
        cpu_cores: { type: integer }
        mem_total: { type: integer, format: int64 }
        disk_total: { type: integer, format: int64 }
        boot_time: { type: string, format: date-time, nullable: true }
        current_conn: { type: integer }
        net_in_speed: { type: integer, format: int64 }
        net_out_speed: { type: integer, format: int64 }
        cpu_usage: { type: number, format: float }
        mem_used: { type: integer, format: int64 }
        disk_used: { type: integer, format: int64 }
        load1: { type: number, format: float }
        uptime: { type: integer, format: int64 }
        config_version: { type: integer, format: int64 }
        last_error: { type: string }
        health_score:
          type: integer
          minimum: 0
          maximum: 100
          description: 健康度评分（综合在线率、同步失败率、CPU/内存水位）
        drift_detected: { type: boolean }
        drift_detail: {}
        remark: { type: string }

    NodeCreateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        role:
          type: string
          enum: [inbound, outbound, both]
          default: both
        group_ids:
          type: array
          items: { type: integer, format: int64 }
        weight: { type: integer, default: 1 }
        max_conn: { type: integer, default: 0 }
        connect_host: { type: string }
        is_static: { type: boolean }
        remark: { type: string }

    NodeUpdateInput:
      $ref: '#/components/schemas/NodeCreateInput'

    NodeCreateResult:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        token: { type: string }
        install_command: { type: string }
        status: { type: string }

    NodeGroup:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        remark: { type: string }

    NodeGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        remark: { type: string }

    DeviceGroup:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type:
          type: string
          enum: [inbound, outbound]
        node_ids:
          type: array
          description: 组成员（有序；出口组的顺序参与负载均衡决策）
          items: { type: integer, format: int64 }
        config: {}
        balance:
          type: string
          enum: [least_conn, round_robin, hash_ip, weighted]
        health_check_enable: { type: boolean }
        health_check_interval: { type: integer }
        health_check_timeout: { type: integer }
        health_check_fail_count: { type: integer }
        health_check_succ_count: { type: integer }
        failover_group_id:
          type: integer
          format: int64
          description: 本组全挂时转投的组；必须与当前组拥有相同的入口权限配置
        remark: { type: string }

    DeviceGroupInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 64 }
        type: { type: string, enum: [inbound, outbound] }
        node_ids:
          type: array
          items: { type: integer, format: int64 }
        config: {}
        balance:
          type: string
          enum: [least_conn, round_robin, hash_ip, weighted]
          default: least_conn
        health_check_enable: { type: boolean, default: true }
        health_check_interval: { type: integer, default: 10 }
        health_check_timeout: { type: integer, default: 3 }
        health_check_fail_count: { type: integer, default: 3 }
        health_check_succ_count: { type: integer, default: 2 }
        failover_group_id: { type: integer, format: int64 }
        remark: { type: string }

    DeviceGroupSchema:
      type: object
      properties:
        type: { type: string, enum: [inbound, outbound] }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              type:
                type: string
                enum: [string, number, boolean, array, select, text, object]
              default: {}
              options:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    value: {}
              required: { type: boolean }
              min: { type: number }
              max: { type: number }
              help: { type: string }
              risk: { type: boolean, description: 是否标记为风险项 }

    GroupHealth:
      type: object
      properties:
        group_id: { type: integer, format: int64 }
        group_name: { type: string }
        available: { type: integer }
        total: { type: integer }
        nodes:
          type: array
          items:
            type: object
            properties:
              node_id: { type: integer, format: int64 }
              node_name: { type: string }
              online: { type: boolean }
              healthy: { type: boolean }
              current_conn: { type: integer }
              weight: { type: integer }
              load_ratio: { type: number, format: float }
              fail_count: { type: integer }

    ForwardRule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        user_id: { type: integer, format: int64 }
        rule_group_id: { type: integer, format: int64 }
        inbound_group_id: { type: integer, format: int64 }
        listen_port:
          type: integer
          description: 0 表示随机端口
        listen_port_end:
          type: integer
          description: 端口段结束；0 表示单端口
        outbound_group_id:
          type: integer
          format: int64
          description: 0 表示单端（入口直出）
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
        target_balance:
          type: string
          enum: [failover, least_conn, round_robin, weighted, hash_ip]
        inbound_multiplier:
          type: number
          format: float
          description: 范围 0~100，最多 2 位小数
        outbound_multiplier:
          type: number
          format: float
        speed_limit:
          type: integer
          format: int64
          description: byte/s，0 表示不限
        conn_limit: { type: integer }
        ip_limit: { type: integer }
        options: {}
        chain_groups:
          type: array
          description: 链式出口设备组 ID（长度 2 或 3）
          items: { type: integer, format: int64 }
        reverse_enable: { type: boolean }
        reverse_port: { type: integer }
        reverse_group_id: { type: integer, format: int64 }
        is_sub_rule: { type: boolean }
        parent_id: { type: integer, format: int64 }
        sni: { type: string }
        shaping:
          type: array
          description: 整流选项：1 拒绝 TLS1.2，2 拒绝全部 TLS，3 拒绝 HTTP/1.x，4 拒绝 WS，2000 跳过 IPv6
          items: { type: integer }
        sync_status:
          type: string
          enum: [unsynced, syncing, normal, failed]
        sync_error:
          type: string
          description: 同步失败时节点返回的原始错误
        synced_at: { type: string, format: date-time, nullable: true }
        traffic_in:
          type: integer
          format: int64
          description: 累计入口流量（字节，已乘倍率）
        traffic_out:
          type: integer
          format: int64
        enable: { type: boolean }
        remark: { type: string }

    ForwardRuleInput:
      type: object
      required: [name, inbound_group_id, listen_port, targets]
      properties:
        name: { type: string, maxLength: 128 }
        user_id: { type: integer, format: int64 }
        rule_group_id: { type: integer, format: int64 }
        inbound_group_id: { type: integer, format: int64 }
        listen_port: { type: integer }
        listen_port_end: { type: integer }
        outbound_group_id: { type: integer, format: int64 }
        targets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Target'
        target_balance:
          type: string
          enum: [failover, least_conn, round_robin, weighted, hash_ip]
          default: failover
        inbound_multiplier:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 1
        outbound_multiplier:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 1
        speed_limit: { type: integer, format: int64 }
        conn_limit: { type: integer }
        ip_limit: { type: integer }
        options: {}
        chain_groups:
          type: array
          items: { type: integer, format: int64 }
        reverse_enable: { type: boolean }
        reverse_port: { type: integer }
        reverse_group_id: { type: integer, format: int64 }
        sni: { type: string }
        shaping:
          type: array
          items: { type: integer }
        enable: { type: boolean, default: true }
        remark: { type: string }

    Target:
      type: object
      required: [host, port]
      properties:
        host:
          type: string
          description: 域名或 IP
        port: { type: integer, minimum: 1, maximum: 65535 }
        weight: { type: integer, default: 1 }
        status:
          type: string
          enum: [up, down]
          description: down 的目标不参与分发

    BatchActionRequest:
      type: object
      required: [action, ids]
      properties:
        action:
          type: string
          enum:
            - enable
            - disable
            - delete
            - set_rule_group
            - set_multiplier
            - scale_multiplier
            - set_outbound_group
            - set_limits
            - set_chain
        ids:
          type: array
          items: { type: integer, format: int64 }
        params:
          type: object
          additionalProperties: true

    ImportRequest:
      type: object
      required: [format, content]
      properties:
        format:
          type: string
          enum: [text, json]
        content: { type: string }
        inbound_group_id: { type: integer, format: int64 }
        outbound_group_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }

    ImportPreview:
      type: object
      properties:
        total: { type: integer }
        will_create: { type: integer }
        conflicts:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              name: { type: string }
              reason: { type: string }
              suggestion: { type: string }
        invalid:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              raw: { type: string }
              reason: { type: string }

    RuleGroup:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sort: { type: integer }
        remark: { type: string }

    RuleGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        sort: { type: integer }
        remark: { type: string }

    ReorderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }

    TrafficPoint:
      type: object
      properties:
        time:
          type: string
          description: 时间桶标识（按小时为 YYYY-MM-DD HH:00，按天为 YYYY-MM-DD）
        bytes:
          type: integer
          format: int64
          description: 乘倍率后的字节数
        raw_bytes:
          type: integer
          format: int64
          description: 实际字节数

    TrafficOverview:
      type: object
      properties:
        today: { type: integer, format: int64 }
        yesterday: { type: integer, format: int64 }
        this_month: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        online_users: { type: integer }
        online_nodes: { type: integer }
        total_nodes: { type: integer }
        active_rules: { type: integer }

    TrafficTopItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        bytes: { type: integer, format: int64 }
        raw_bytes: { type: integer, format: int64 }

    DashboardData:
      type: object
      properties:
        overview:
          $ref: '#/components/schemas/TrafficOverview'
        timeseries:
          type: array
          items:
            $ref: '#/components/schemas/TrafficPoint'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        pending:
          type: object
          properties:
            sync_failed_rules:
              type: array
              items:
                $ref: '#/components/schemas/ForwardRule'
            offline_nodes:
              type: array
              items:
                $ref: '#/components/schemas/Node'
            active_alerts:
              type: array
              items:
                $ref: '#/components/schemas/AlertHistory'

    ProbeMetric:
      type: object
      properties:
        id: { type: integer, format: int64 }
        node_id: { type: integer, format: int64 }
        timestamp: { type: integer, format: int64, description: Unix 秒 }
        cpu: { type: number, format: float, description: 使用率 0~100 }
        mem_used: { type: integer, format: int64 }
        mem_total: { type: integer, format: int64 }
        swap_used: { type: integer, format: int64 }
        swap_total: { type: integer, format: int64 }
        disk_used: { type: integer, format: int64 }
        disk_total: { type: integer, format: int64 }
        net_in: { type: integer, format: int64 }
        net_out: { type: integer, format: int64 }
        net_in_speed: { type: integer, format: int64 }
        net_out_speed: { type: integer, format: int64 }
        load1: { type: number, format: float }
        load5: { type: number, format: float }
        load15: { type: number, format: float }
        tcp_conn: { type: integer }
        udp_conn: { type: integer }
        uptime: { type: integer, format: int64 }

    Session:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64 }
        node_id: { type: integer, format: int64 }
        client_ip: { type: string }
        client_ip_hash: { type: string }
        device_id: { type: string }
        conn_count: { type: integer }
        protocol:
          type: string
          enum: [ws, http, tls, direct, udp]
        started_at: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        upload: { type: integer, format: int64 }
        download: { type: integer, format: int64 }

    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        username: { type: string }
        action:
          type: string
          description: create | update | delete | login | sync | migrate ...
        resource: { type: string }
        resource_id: { type: integer, format: int64 }
        before: { description: 变更前快照 }
        after: { description: 变更后快照 }
        ip: { type: string }
        user_agent: { type: string }
        result:
          type: string
          enum: [success, failed]
        message: { type: string }
        created_at: { type: string, format: date-time }

    APIToken:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        token:
          type: string
          description: 明文 Token，仅在创建时返回一次
        scopes:
          type: array
          items: { type: string }
        ip_whitelist:
          type: array
          items: { type: string }
        expire_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        enabled: { type: boolean }

    APITokenInput:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, maxLength: 64 }
        scopes:
          type: array
          items:
            type: string
            enum:
              - node:read
              - node:write
              - node:exec
              - group:read
              - group:write
              - rule:read
              - rule:write
              - user:read
              - user:write
              - traffic:read
              - system:read
              - system:write
              - migrate:run
              - backup:run
        ip_whitelist:
          type: array
          description: CIDR 列表，空数组表示不限制
          items: { type: string }
        expire_at: { type: string, format: date-time, nullable: true }

    AlertRule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type:
          type: string
          enum:
            - node_offline
            - node_cpu
            - node_mem
            - node_disk
            - rule_sync_failed
            - user_traffic_pct
            - rule_traffic_pct
            - node_traffic_pct
            - cert_expire
        target_id:
          type: integer
          format: int64
          description: 关联节点/用户/规则 ID，0 表示全局
        threshold: { type: number, format: float }
        duration:
          type: integer
          description: 持续时长（秒）后才触发，用于防抖
        channels:
          type: array
          items:
            $ref: '#/components/schemas/AlertChannel'
        silence_for:
          type: integer
          description: 静默期（秒），避免重复通知
        enabled: { type: boolean }
        last_fired_at: { type: string, format: date-time, nullable: true }

    AlertRuleInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 128 }
        type: { type: string }
        target_id: { type: integer, format: int64 }
        threshold: { type: number, format: float }
        duration: { type: integer }
        channels:
          type: array
          items:
            $ref: '#/components/schemas/AlertChannel'
        silence_for: { type: integer, default: 300 }
        enabled: { type: boolean, default: true }

    AlertChannel:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [webhook, telegram, email]
        url: { type: string, format: uri, description: webhook 地址 }
        token: { type: string, description: Telegram bot token }
        chat: { type: string, description: Telegram chat id }
        host: { type: string, description: SMTP 主机 }
        port: { type: integer, description: SMTP 端口 }
        user: { type: string }
        pass: { type: string }
        to: { type: string, description: 收件人 }

    AlertHistory:
      type: object
      properties:
        id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64 }
        level:
          type: string
          enum: [info, warning, critical]
        title: { type: string }
        content: { type: string }
        resolved: { type: boolean }
        resource: { type: string }
        resource_id: { type: integer, format: int64 }
        fired_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }

    ConfigSnapshot:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        reason:
          type: string
          description: manual | auto_before_sync | auto_daily | before_migrate
        checksum: { type: string }
        rule_count: { type: integer }
        group_count: { type: integer }
        node_count: { type: integer }
        created_at: { type: string, format: date-time }

    SystemInfo:
      type: object
      properties:
        version: { type: string }
        build: { type: string }
        uptime: { type: integer, format: int64 }
        database: { type: string }
        node_count: { type: integer }
        online_node_count: { type: integer }
        rule_count: { type: integer }
        user_count: { type: integer }
        schema_version: { type: integer }
        subscriber_count: { type: integer }
        config_version: { type: integer, format: int64 }

    SystemStatus:
      type: object
      properties:
        healthy: { type: boolean }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              ok: { type: boolean }
              message: { type: string }

    TaskStatus:
      type: object
      properties:
        name: { type: string }
        desc: { type: string }
        interval_sec: { type: integer }
        running: { type: boolean }
        last_run_at: { type: string, format: date-time, nullable: true }
        last_result: { type: string }
        last_error: { type: string }
        next_run_at: { type: string, format: date-time, nullable: true }

    MigrateBatch:
      type: object
      properties:
        id: { type: integer, format: int64 }
        source: { type: string, enum: [nyanpass, openroute] }
        source_dsn: { type: string, description: 脱敏后存储 }
        target_dsn: { type: string }
        status:
          type: string
          enum: [pending, running, finished, failed, rolled_back]
        stage:
          type: integer
          minimum: 1
          maximum: 7
          description: 当前阶段
        dry_run: { type: boolean }
        total_rows: { type: integer, format: int64 }
        migrated_rows: { type: integer, format: int64 }
        report: { description: 完整预检/迁移报告 }
        backup_path: { type: string }
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    MigrationInput:
      type: object
      required: [source, dsn]
      properties:
        source:
          type: string
          enum: [nyanpass, openroute]
        dsn:
          type: string
          description: 源库 DSN，支持 sqlite3 / mysql / postgres
          example: 'sqlite3:///old/nyanpass/data.db'
        rename_policy:
          type: string
          enum: [fail, suffix, skip]
          default: fail
          description: 名称冲突处理策略

    PrecheckReport:
      type: object
      properties:
        summary:
          type: object
          properties:
            source: { type: string }
            source_version: { type: string }
            target: { type: string }
            mode: { type: string }
        tables:
          type: array
          items:
            type: object
            properties:
              source_table: { type: string }
              target_table: { type: string }
              rows: { type: integer, format: int64 }
              note: { type: string }
        conflicts:
          type: object
          properties:
            name_conflicts:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string }
                  names:
                    type: array
                    items: { type: string }
                  suggestion: { type: string }
            port_conflicts:
              type: array
              items:
                type: object
                properties:
                  group: { type: string }
                  port: { type: integer }
                  rules:
                    type: array
                    items: { type: string }
            missing_refs:
              type: array
              items:
                type: object
                properties:
                  rule: { type: string }
                  missing: { type: string }
            zero_multiplier_groups:
              type: array
              items: { type: string }
        discarded_fields:
          type: array
          description: 不迁移的字段（丢弃清单）
          items: { type: string }
        filled_fields:
          type: array
          items: { type: string }
        samples:
          type: array
          items:
            type: object
            properties:
              before: { type: string }
              after: { type: string }
        suggestions:
          type: array
          items: { type: string }
        text:
          type: string
          description: 与终端同款的纯文本报告
        has_blocking_conflict: { type: boolean }

    Backup:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        path: { type: string }
        size: { type: integer, format: int64 }
        checksum: { type: string }
        manifest: {}
        with_secret: { type: boolean }
        created_at: { type: string, format: date-time }

    HeartbeatRequest:
      type: object
      required: [node_id]
      properties:
        node_id: { type: integer, format: int64 }
        version: { type: string }
        config_version: { type: integer, format: int64 }
        metrics:
          $ref: '#/components/schemas/NodeMetrics'
        running_rules:
          type: array
          items:
            type: object
            properties:
              rule_id: { type: integer, format: int64 }
              port: { type: integer }
              status:
                type: string
                enum: [running, stopped, failed]
              conn: { type: integer }
        timestamp: { type: integer, format: int64 }

    NodeMetrics:
      type: object
      properties:
        cpu: { type: number, format: float }
        mem_used: { type: integer, format: int64 }
        mem_total: { type: integer, format: int64 }
        disk_used: { type: integer, format: int64 }
        disk_total: { type: integer, format: int64 }
        net_in: { type: integer, format: int64 }
        net_out: { type: integer, format: int64 }
        net_in_speed: { type: integer, format: int64 }
        net_out_speed: { type: integer, format: int64 }
        load1: { type: number, format: float }
        load5: { type: number, format: float }
        load15: { type: number, format: float }
        tcp_conn: { type: integer }
        udp_conn: { type: integer }
        uptime: { type: integer, format: int64 }

    NodeConfigPayload:
      type: object
      properties:
        config_version: { type: integer, format: int64 }
        full:
          type: boolean
          description: 是否为全量配置；false 表示增量
        rules:
          type: array
          items:
            type: object
            properties:
              rule_id: { type: integer, format: int64 }
              name: { type: string }
              listen_port: { type: integer }
              protocol: { type: string }
              targets:
                type: array
                items:
                  $ref: '#/components/schemas/Target'
              options: {}
              speed_limit: { type: integer, format: int64 }
              conn_limit: { type: integer }
              ip_limit: { type: integer }
              enable: { type: boolean }
        removed_rule_ids:
          type: array
          description: 增量下发时被移除的规则 ID
          items: { type: integer, format: int64 }
        device_group_config: {}
        heartbeat_interval: { type: integer }
